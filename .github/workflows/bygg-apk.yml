name: Bygg APK
on:
  push:
    branches: [android-app]
    paths-ignore: ['dist/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bygg-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bygg
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Lägg APK i dist/
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Festivalkompassen.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add dist/Festivalkompassen.apk
          git commit -m "APK bygge ${GITHUB_RUN_NUMBER} [skip ci]" || echo "ingen ändring"
          git pull --rebase origin android-app || true
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Festivalkompassen-apk
          path: dist/Festivalkompassen.apk
